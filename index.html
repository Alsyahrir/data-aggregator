<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Solar Data Aggregator</title>
  <meta name="description" content="Aggregate, clean, align, and forecast solar production data with automated schema detection and weather enrichment." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☀️</text></svg>" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- Stlite CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.1/build/stlite.css" />

  <style>
    :root {
      --bg-base: #111318;
      --bg-card: rgba(26, 30, 40, 0.7);
      --amber-accent: #e8a051;
      --amber-glow: rgba(232, 160, 81, 0.2);
      --text-main: #f0ede8;
      --text-muted: #8c96a8;
      --border-subtle: rgba(232, 160, 81, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Splash Loading Screen ───────────────────────── */
    #splash-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, rgba(232, 160, 81, 0.08) 0%, #111318 70%);
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s;
    }

    #splash-loader.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 44px 36px;
      max-width: 440px;
      width: 90%;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), 0 0 30px var(--amber-glow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .sun-icon {
      font-size: 3.5rem;
      display: inline-block;
      margin-bottom: 16px;
      animation: gentle-pulse 2.8s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 18px rgba(232, 160, 81, 0.45));
    }

    @keyframes gentle-pulse {
      0% {
        transform: scale(0.96) rotate(-4deg);
        filter: drop-shadow(0 0 12px rgba(232, 160, 81, 0.3));
      }
      100% {
        transform: scale(1.06) rotate(4deg);
        filter: drop-shadow(0 0 24px rgba(232, 160, 81, 0.6));
      }
    }

    .loader-title {
      font-family: 'DM Sans', sans-serif;
      font-size: 1.45rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    .loader-desc {
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 40%;
      background: linear-gradient(90deg, #e8a051, #d4785c);
      border-radius: 999px;
      animation: indeterminate 1.8s infinite ease-in-out;
    }

    @keyframes indeterminate {
      0% {
        left: -40%;
        width: 30%;
      }
      50% {
        left: 30%;
        width: 50%;
      }
      100% {
        left: 100%;
        width: 30%;
      }
    }

    .loader-hint {
      margin-top: 18px;
      font-size: 0.78rem;
      color: #6d7685;
      letter-spacing: 0.02em;
    }

    /* ── Streamlit Root Container ────────────────────── */
    #root {
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <!-- Warm Branded Splash Loader -->
  <div id="splash-loader">
    <div class="loader-card">
      <div class="sun-icon">☀️</div>
      <h1 class="loader-title">Solar Data Aggregator</h1>
      <p class="loader-desc">Initializing WebAssembly Python runtime &amp; scientific packages in your browser...</p>
      <div class="progress-bar-container">
        <div class="progress-bar-fill"></div>
      </div>
      <p class="loader-hint">First-time load downloads cached Pyodide wheels (~30MB)</p>
    </div>
  </div>

  <!-- App Mount Root -->
  <div id="root"></div>

  <!-- Stlite Module Mount -->
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.1/build/stlite.js";

    // Theme configuration matching .streamlit/config.toml
    const configTomlContent = `[theme]
primaryColor = "#e8a051"
backgroundColor = "#111318"
secondaryBackgroundColor = "#1a1e28"
textColor = "#f0ede8"
font = "sans serif"

[server]
maxUploadSize = 200
`;

    try {
      mount(
        {
          entrypoint: "app.py",
          requirements: [
            "pandas",
            "numpy",
            "plotly",
            "scikit-learn",
            "openpyxl",
          ],
          files: {
            "app.py": { url: "./app.py" },
            ".streamlit/config.toml": configTomlContent,
            "solar_aggregator/__init__.py": { url: "./solar_aggregator/__init__.py" },
            "solar_aggregator/aggregator.py": { url: "./solar_aggregator/aggregator.py" },
            "solar_aggregator/detection.py": { url: "./solar_aggregator/detection.py" },
            "solar_aggregator/forecasting.py": { url: "./solar_aggregator/forecasting.py" },
            "solar_aggregator/llm_integration.py": { url: "./solar_aggregator/llm_integration.py" },
            "solar_aggregator/processing.py": { url: "./solar_aggregator/processing.py" },
            "solar_aggregator/schema.py": { url: "./solar_aggregator/schema.py" },
            "solar_aggregator/visualization.py": { url: "./solar_aggregator/visualization.py" },
            "solar_aggregator/weather.py": { url: "./solar_aggregator/weather.py" },
          },
        },
        document.getElementById("root")
      );

      // Hide splash loader once Stlite renders the app
      const observer = new MutationObserver((mutations, obs) => {
        const rootEl = document.getElementById("root");
        if (rootEl && rootEl.querySelector(".stApp, [data-testid='stAppViewContainer']")) {
          const splash = document.getElementById("splash-loader");
          if (splash) {
            splash.classList.add("loaded");
            setTimeout(() => splash.remove(), 700);
          }
          obs.disconnect();
        }
      });

      observer.observe(document.getElementById("root"), {
        childList: true,
        subtree: true,
      });

      // Safety timeout: dismiss loader after 45s regardless
      setTimeout(() => {
        const splash = document.getElementById("splash-loader");
        if (splash && !splash.classList.contains("loaded")) {
          splash.classList.add("loaded");
        }
      }, 45000);

    } catch (err) {
      console.error("Error mounting stlite app:", err);
      const desc = document.querySelector(".loader-desc");
      if (desc) {
        desc.textContent = "Initialization encountered an issue. Check the browser console for details.";
        desc.style.color = "#d4785c";
      }
    }
  </script>
</body>
</html>
